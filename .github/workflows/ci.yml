name: CI

on:
  push:
    branches: [main, update]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pkg
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Standalone repo: provide a parent pub workspace so pkg/pubspec.yaml stays clean for dry-run.
      - name: Create isolated workspace wrapper
        run: |
          cat << 'EOF' > pubspec.yaml
          name: _ci_workspace
          publish_to: none
          environment:
            sdk: ^3.14.0
          workspace:
            - pkg
          EOF
      - name: Install dependencies
        working-directory: pkg
        run: dart pub get
      - name: Analyze
        working-directory: pkg
        run: dart analyze --fatal-infos
      - name: Run tests
        working-directory: pkg
        run: dart test
      - name: Dry-run publish check
        working-directory: pkg
        run: dart pub publish --dry-run
